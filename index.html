<!DOCTYPE html>
<html>
<head>
<script
type="module"
src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
</script>
</head>
<body>

<model-viewer
src="yuyuyu.glb"
ar
ar-modes="scene-viewer webxr"
camera-controls
auto-rotate
style="width:100vw;height:100vh;">

<button slot="ar-button"
style="
font-size:24px;
padding:20px;
border-radius:20px;
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
">
ARで見る
</button>
</model-viewer>

</body>
</html>
